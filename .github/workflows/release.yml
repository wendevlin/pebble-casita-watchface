name: Release

on:
  release:
    types: [published]

jobs:
  build:
    name: Build & Attach .pbw
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: bun install

      - name: Install pebble-tool
        run: pip install pebble-tool

      - name: Install Pebble SDK
        run: |
          pebble sdk set-channel release
          yes | pebble sdk install 4.33.1

      - name: Build pkjs bundle
        run: bun run build:pkjs

      - name: Generate PDC resources
        run: bun run resources

      - name: Build .pbw
        run: pebble build

      - name: Attach .pbw to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" build/*.pbw
